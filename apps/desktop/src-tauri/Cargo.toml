[package]
name = "webcam-studio-desktop"
description = "Desktop app for Webcam Studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
studio-core.workspace = true
studio-segmentation.workspace = true
studio-engine.workspace = true
studio-vdevice.workspace = true
studio-vdevice-macos.workspace = true
studio-capture.workspace = true
# Only the formats a background picture is likely to use.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

ureq = { version = "3.1", default-features = false, features = ["rustls"] }
sha2 = "0.10"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }

[lints]
workspace = true
