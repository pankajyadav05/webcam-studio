[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop app needs system webview libraries, so it is left out of the default build.
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.2.0"
repository = "https://github.com/pankajyadav05/webcam-studio"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Apple framework bindings. Only the macOS crates use them, and each crate turns on the
# cargo features it needs.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }

studio-core = { path = "crates/core" }
studio-engine = { path = "crates/engine" }
studio-segmentation = { path = "crates/segmentation" }
studio-audio = { path = "crates/audio" }
studio-vdevice = { path = "crates/vdevice" }
studio-vdevice-linux = { path = "crates/vdevice-linux" }
studio-vdevice-windows = { path = "crates/vdevice-windows" }
studio-vdevice-macos = { path = "crates/vdevice-macos" }
studio-capture = { path = "crates/capture" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
